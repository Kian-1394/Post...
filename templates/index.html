{% extends "base.html" %} {% block title %}Post... | Home{% endblock title %}
{% block main %}
  <div class="row gap-3 my-5">
    {% for post in posts %}
      <div class="col-12">
        <div class="card">
          <div class="card-body">
            <h3 class="display-6 text-start">{{ post.user.username }}</h3>
            <h3 class="mt-2 text-center">{{ post.title }}</h3>
            <p class="mt-3 text-center">{{ post.text }}</p>
          </div>
        </div>
      </div>
    {% empty %}
      <div
        class="d-flex justify-content-center align-items-center"
        style="height: 70vh"
      >
        <h3>No posts yet</h3>
      </div>
    {% endfor %}
  </div>
{% endblock main %}
