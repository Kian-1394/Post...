{% extends "base.html" %} {% block title %}Post... | Home{% endblock title %}
{% block main %}
  <div class="row gap-3 d-flex justify-content-center align-items-center">
    {% for post in posts %}
      <div class="col-lg-12">
        <div class="card px-2 py-4">
          <div class="card-body">
            <h3 class="display-6 mb-4">{{ post.user.username }}</h3>
            <h3 class="mt-2">{{ post.title }}</h3>
            <pre class="mt-3">{{ post.text }}</pre>
          </div>
        </div>
      </div>
    {% empty %}
      <div>
        <h3>No posts yet</h3>
      </div>
    {% endfor %}
  </div>
{% endblock main %}
