{% extends "base.html" %} {% block title %} Post... | Add Post {% endblock title%} 
{% block main %}
<div class="form-page">
  <form method="post" class="card shadow p-4 form-box">
    {% csrf_token %}

    <div class="mb-3">
      <label for="{{ form.title.id_for_label }}" class="form-label">
        Title:
      </label>

      <input
        type="text"
        class="form-control"
        name="{{ form.title.html_name }}"
        id="{{ form.title.id_for_label }}"
        value="{{ form.title.value|default:'' }}"
      />

      {% if form.title.errors %}
      <div
        class="alert alert-danger alert-dismissible fade show mt-2"
        role="alert"
      >
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
          aria-label="Close"
        ></button>

        {{ form.title.errors }}
      </div>
      {% endif %}
    </div>

    <div class="mb-3">
      <label for="{{ form.text.id_for_label }}" class="form-label">
        Text:
      </label>

      <textarea
        class="form-control"
        name="{{ form.text.html_name }}"
        id="{{ form.text.id_for_label }}"
        rows="3"
      >
{{ form.text.value|default:'' }}</textarea
      >

      {% if form.text.errors %}
      <div
        class="alert alert-danger alert-dismissible fade show mt-2"
        role="alert"
      >
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
          aria-label="Close"
        ></button>

        {{ form.text.errors }}
      </div>
      {% endif %}
    </div>

    <div class="d-flex justify-content-center">
      <button type="submit" class="btn btn-primary">Add</button>
    </div>
  </form>
</div>
{% endblock main %}
